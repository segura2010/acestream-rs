[package]
name = "acestream-rs"
version = "0.1.0"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "acelib_android"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
aes = "0.6.0"
hex-literal = "0.3.1"
hex = "0.4.3"
generic-array = "0.14.4"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11.5"
serde_bencode = "^0.2.3"
reqwest = { version = "0.11.4", features = ["blocking"] }
sha-1 = "0.9.8"
serde-xml-rs = "0.5.1"
base64 = "0.13.0"
clap = "2.33.3"
resolve = "0.2.0"
byteorder = "1.4.3"
rand = "0.8.4"
openssl = { version = "0.10.29", features = ["vendored"] }