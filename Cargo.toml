[package]
name = "acestream-rs"
version = "1.0.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "acelib"
path = "src/lib.rs"
# "rlib" lets the CLI binary link the library instead of compiling every
# module a second time.
crate-type = ["cdylib", "staticlib", "rlib"]

# The only dependency left: the JNI bindings needed by the Android entry point.
# Everything else (HTTP, DNS, bencode, SHA-1, AES, base64...) is implemented on
# top of the standard library.
[target.'cfg(target_os="android")'.dependencies]
jni = { version = "0.5", default-features = false }

[dependencies]

[profile.release]
lto = true
codegen-units = 1
strip = true
